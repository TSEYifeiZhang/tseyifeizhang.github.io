short_bio: >-
  <p>
    I am an Assistant Professor in Finance at <a href="https://english.phbs.pku.edu.cn/" target="_blank">Peking University HSBC Business School (北京大学汇丰商学院)</a>. I obtained my Ph.D. in Economics from <a href="https://www.tse-fr.eu/" target="_blank">Toulouse School of Economics (TSE)</a> in 2022, where my dissertation committee included Ulrich Hege, Milo Bianchi, Florian Ederer, Merih Sevilir, and Edith Ginglinger. During my doctoral studies, I was a Visiting Ph.D. Student at the <a href="https://som.yale.edu/" target="_blank">Yale School of Management</a> in 2019.
  </p>
  <p>
    My research interests lie in <strong>Corporate Finance and Governance</strong>, <strong>Innovation and Patents</strong>, <strong>Climate and ESG Finance</strong>, <strong>Entrepreneurial Finance / Venture Capital</strong>, and the <strong>Economics of AI</strong>. At PHBS, I teach Master-level courses in <em>Climate and ESG Finance</em> and <em>Venture Capital</em>.
  </p>

