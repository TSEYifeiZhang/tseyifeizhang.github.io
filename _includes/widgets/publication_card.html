{% assign publications = include.publications %}
<div class="my-3 p-4 bg-white shadow-sm rounded-lg">
    <div class="d-flex justify-content-between align-items-baseline border-bottom border-gray pb-2 mb-2">
        <h6 class="mb-0 font-weight-bold">{{ include.title | default: "Selected Publications & Working Papers" }}</h6>
        <a href="{{ '/publications' | relative_url }}" class="small">View all &rarr;</a>
    </div>
    {% for item in publications %}
        {% include widgets/publication_item.html item=item %}
    {% endfor %}
</div>
